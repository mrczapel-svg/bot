name: Bot1 Auto Visit

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:18-slim
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y chromium ca-certificates
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Bot1
        run: node bot.js
